<div class="rules">
    <h3>📝 系統與 AI 技術說明</h3>
    <ul>
        <li><strong>精準邊界：</strong>紅藍鋸齒邊界完美貼合頂點，幾何相切零死角。</li>
        <li><strong>位元棋盤 (Bitboards)：</strong>121 格壓縮為 BigInt，利用位元平移極速運算。</li>
        <li><strong>迭代加深 (Iterative Deepening)：</strong>由淺入深推演，利用淺層的最佳步優化深層的搜尋排序。</li>
        <li><strong>殺手與歷史啟發 (Killer & History)：</strong>AI 會記憶曾引發剪枝的黃金防守步，遇新盤面優先嘗試，極大化剪枝效率！</li>
    </ul>

<!-- 核心演算法 (主執行緒與 Worker 共用) -->
<script id="hexCoreLogic">
const SIZE = 11;

let NOT_COL_0 = 0n;
let NOT_COL_10 = 0n;
let RED_TOP = 0n;
let RED_BOTTOM = 0n;
let BLUE_LEFT = 0n;
let BLUE_RIGHT = 0n;
let BOARD_MASK = 0n;

for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
        let bit = 1n << BigInt(r * SIZE + c);
        BOARD_MASK |= bit;
        if (c !== 0) NOT_COL_0 |= bit;
        if (c !== SIZE - 1) NOT_COL_10 |= bit;
        if (r === 0) RED_TOP |= bit;
        if (r === SIZE - 1) RED_BOTTOM |= bit;
        if (c === 0) BLUE_LEFT |= bit;
        if (c === SIZE - 1) BLUE_RIGHT |= bit;
    }
}

const ZOBRIST_PIECES = new BigInt64Array(121 * 2);
const ZOBRIST_TURN = new BigInt64Array(2 * 3);
let _seed = 12345;
function nextRandomBigInt() {
    _seed ^= _seed << 13; _seed ^= _seed >> 17; _seed ^= _seed << 5;
    let a = BigInt(_seed >>> 0);
    _seed ^= _seed << 13; _seed ^= _seed >> 17; _seed ^= _seed << 5;
    let b = BigInt(_seed >>> 0);
    return (a << 32n) | b;
}
for (let i = 0; i < 242; i++) ZOBRIST_PIECES[i] = nextRandomBigInt();
for (let i = 0; i < 6; i++) ZOBRIST_TURN[i] = nextRandomBigInt();

function getNeighborsBB(x) {
    return ((x >> 11n) | (x << 11n) | ((x >> 10n) & NOT_COL_0) | ((x << 1n) & NOT_COL_0) | ((x >> 1n) & NOT_COL_10) | ((x << 10n) & NOT_COL_10)) & BOARD_MASK;
}

function checkWinBB(pieces, player) {
    let connected = player === 1 ? (pieces & RED_TOP) : (pieces & BLUE_LEFT);
    if (connected === 0n) return false;
    let prev = 0n;
    while (connected !== prev) {
        prev = connected;
        connected |= (getNeighborsBB(connected) & pieces);
    }
    let target = player === 1 ? RED_BOTTOM : BLUE_RIGHT;
    return (connected & target) !== 0n;
}

function getDistanceBB(pieces, emptySpaces, player) {
    let target = player === 1 ? RED_BOTTOM : BLUE_RIGHT;
    let reached = 0n;
    let tier = 0n;
    let next_tier = player === 1 ? RED_TOP : BLUE_LEFT;
    
    for (let d = 0; d < 121; d++) {
        let changed = true;
        tier = next_tier;
        while (changed) {
            let old = tier;
            tier |= (getNeighborsBB(tier) & pieces);
            if (tier === old) changed = false;
        }
        if ((tier & target) !== 0n) return d;
        reached |= tier;
        next_tier = (getNeighborsBB(tier) & emptySpaces) & ~reached;
        if (next_tier === 0n) break;
    }
    return 9999;
}

function evalBB(red, blue, povPlayer) {
    let emptySpaces = BOARD_MASK & ~(red | blue);
    let redDist = getDistanceBB(red, emptySpaces, 1);
    let blueDist = getDistanceBB(blue, emptySpaces, 2);
    
    if (redDist === 0) return povPlayer === 1 ? 1000000 : -1000000;
    if (blueDist === 0) return povPlayer === 2 ? 1000000 : -1000000;
    
    return povPlayer === 1 ? (blueDist * 10 - redDist * 12) : (redDist * 10 - blueDist * 12);
}
</script>

<!-- Worker 腳本 (包含 TT, 迭代加深, 殺手啟發與歷史啟發) -->
<script id="aiWorkerCode" type="javascript/worker">
const TT_SIZE = 1 << 19; // 524,288
const TT_MASK = BigInt(TT_SIZE - 1);
const tt_hash = new BigInt64Array(TT_SIZE);
const tt_depth = new Int8Array(TT_SIZE);
const tt_flag = new Uint8Array(TT_SIZE);
const tt_val = new Int32Array(TT_SIZE);
const tt_bestMove = new Int8Array(TT_SIZE);

const EXACT = 1, LOWERBOUND = 2, UPPERBOUND = 3;
const MAX_PLY = 64;

// Heuristics Tables (Each worker thread maintains its own)
const killerMoves = Array.from({length: MAX_PLY}, () => new Int8Array([-1, -1]));
const historyTable = [new Int32Array(121), new Int32Array(121)];

function minimax(redPieces, bluePieces, hash, depth, ply, alpha, beta, isMaximizing, currentPlayer, piecesPlaced, piecesAllowed, aiPlayerId) {
    let ttIndex = Number(hash & TT_MASK);
    if (tt_hash[ttIndex] === hash && tt_depth[ttIndex] >= depth) {
        let flag = tt_flag[ttIndex];
        let val = tt_val[ttIndex];
        if (flag === EXACT) return val;
        if (flag === LOWERBOUND && val > alpha) alpha = val;
        if (flag === UPPERBOUND && val < beta) beta = val;
        if (alpha >= beta) return val;
    }
    
    let redWin = checkWinBB(redPieces, 1);
    let blueWin = checkWinBB(bluePieces, 2);
    if (aiPlayerId === 1 && redWin) return 1000000 + depth;
    if (aiPlayerId === 2 && blueWin) return 1000000 + depth;
    if (aiPlayerId === 1 && blueWin) return -1000000 - depth;
    if (aiPlayerId === 2 && redWin) return -1000000 - depth;
    
    if (depth === 0) return evalBB(redPieces, bluePieces, aiPlayerId);
    
    let bestMove = -1;
    let bestEval = isMaximizing ? -Infinity : Infinity;
    let origAlpha = alpha;
    
    let ttMove = -1;
    if (tt_hash[ttIndex] === hash) ttMove = tt_bestMove[ttIndex];
    
    let emptySpaces = BOARD_MASK & ~(redPieces | bluePieces);
    let candidates = [];
    
    for (let i = 0n; i < 121n; i++) {
        if (emptySpaces & (1n << i)) {
            let idx = Number(i);
            let score = 0;
            // 先進的節點排序：TT > Killer 1 > Killer 2 > History
            if (idx === ttMove) score = 20000000;
            else if (idx === killerMoves[ply][0]) score = 10000000;
            else if (idx === killerMoves[ply][1]) score = 9000000;
            else score = historyTable[currentPlayer - 1][idx];
            candidates.push({ move: idx, score: score });
        }
    }
    
    candidates.sort((a,b) => b.score - a.score);
    let limit = Math.min(candidates.length, 12); 
    
    for (let i = 0; i < limit; i++) {
        let move = candidates[i].move;
        let nextRed = redPieces;
        let nextBlue = bluePieces;
        if (currentPlayer === 1) nextRed |= (1n << BigInt(move));
        else nextBlue |= (1n << BigInt(move));
        
        let nextHash = hash ^ ZOBRIST_PIECES[(currentPlayer - 1) * 121 + move];
        let nextPlaced = piecesPlaced + 1;
        let nextAllowed = piecesAllowed;
        let nextIsMaximizing = isMaximizing;
        let nextPlayer = currentPlayer;
        
        nextHash ^= ZOBRIST_TURN[(currentPlayer - 1) * 3 + piecesPlaced];
        if (nextPlaced === nextAllowed) {
            nextIsMaximizing = !isMaximizing;
            nextPlaced = 0;
            nextAllowed = 2;
            nextPlayer = 3 - currentPlayer;
        }
        nextHash ^= ZOBRIST_TURN[(nextPlayer - 1) * 3 + nextPlaced];
        
        let ev = minimax(nextRed, nextBlue, nextHash, depth - 1, ply + 1, alpha, beta, nextIsMaximizing, nextPlayer, nextPlaced, nextAllowed, aiPlayerId);
        
        if (isMaximizing) {
            if (ev > bestEval) { bestEval = ev; bestMove = move; }
            alpha = Math.max(alpha, ev);
            if (beta <= alpha) {
                // Beta Cutoff (更新殺手步與歷史分數)
                if (killerMoves[ply][0] !== move) {
                    killerMoves[ply][1] = killerMoves[ply][0];
                    killerMoves[ply][0] = move;
                }
                historyTable[currentPlayer - 1][move] += depth * depth;
                break;
            }
        } else {
            if (ev < bestEval) { bestEval = ev; bestMove = move; }
            beta = Math.min(beta, ev);
            if (beta <= alpha) {
                if (killerMoves[ply][0] !== move) {
                    killerMoves[ply][1] = killerMoves[ply][0];
                    killerMoves[ply][0] = move;
                }
                historyTable[currentPlayer - 1][move] += depth * depth;
                break;
            }
        }
    }
    
    tt_hash[ttIndex] = hash;
    tt_depth[ttIndex] = depth;
    tt_val[ttIndex] = bestEval;
    tt_bestMove[ttIndex] = bestMove;
    if (bestEval <= origAlpha) tt_flag[ttIndex] = UPPERBOUND;
    else if (bestEval >= beta) tt_flag[ttIndex] = LOWERBOUND;
    else tt_flag[ttIndex] = EXACT;
    
    return bestEval;
}

self.onmessage = function(e) {
    const { redPieces, bluePieces, baseHash, moves, targetDepth, aiPlayerId, piecesPlaced, piecesAllowed, sharedBuffer } = e.data;
    
    let sharedAlpha = null;
    if (sharedBuffer) sharedAlpha = new Int32Array(sharedBuffer);

    // Iterative Deepening Setup
    let rootMoves = moves.map(m => ({ move: m, score: 0 }));
    let bestGlobalMove = rootMoves[0].move;
    let maxGlobalEval = -Infinity;

    // 清空歷史表以適應新盤面
    historyTable[0].fill(0);
    historyTable[1].fill(0);
    for(let i=0; i<MAX_PLY; i++) { killerMoves[i][0] = -1; killerMoves[i][1] = -1; }

    for (let currentDepth = 1; currentDepth <= targetDepth; currentDepth++) {
        // 利用上一深度的分數來完美排序候選步
        rootMoves.sort((a, b) => b.score - a.score);
        
        let currentIterMax = -Infinity;
        let currentIterBest = rootMoves[0].move;

        for (let i = 0; i < rootMoves.length; i++) {
            let moveObj = rootMoves[i];
            let move = moveObj.move;
            
            let initialAlpha = -Infinity;
            if (sharedAlpha) initialAlpha = Math.max(-Infinity, Atomics.load(sharedAlpha, 0));

            let nextRed = redPieces;
            let nextBlue = bluePieces;
            if (aiPlayerId === 1) nextRed |= (1n << BigInt(move));
            else nextBlue |= (1n << BigInt(move));
            
            let nextHash = baseHash ^ ZOBRIST_PIECES[(aiPlayerId - 1) * 121 + move];
            let nextPlaced = piecesPlaced + 1;
            let nextAllowed = piecesAllowed;
            let nextIsMaximizing = true;
            let nextPlayer = aiPlayerId;

            nextHash ^= ZOBRIST_TURN[(aiPlayerId - 1) * 3 + piecesPlaced];
            if (nextPlaced === nextAllowed) {
                nextIsMaximizing = false;
                nextPlaced = 0;
                nextAllowed = 2;
                nextPlayer = 3 - aiPlayerId;
            }
            nextHash ^= ZOBRIST_TURN[(nextPlayer - 1) * 3 + nextPlaced];

            let evalScore = minimax(nextRed, nextBlue, nextHash, currentDepth - 1, 1, initialAlpha, Infinity, nextIsMaximizing, nextPlayer, nextPlaced, nextAllowed, aiPlayerId);
            
            moveObj.score = evalScore; // 儲存分數供下一深度排序

            if (evalScore > currentIterMax) {
                currentIterMax = evalScore;
                currentIterBest = move;
                if (sharedAlpha) {
                    let expectedAlpha = Atomics.load(sharedAlpha, 0);
                    while (evalScore > expectedAlpha) {
                        let actual = Atomics.compareExchange(sharedAlpha, 0, expectedAlpha, evalScore);
                        if (actual === expectedAlpha) break;
                        expectedAlpha = actual;
                    }
                }
            }
        }
        
        bestGlobalMove = currentIterBest;
        maxGlobalEval = currentIterMax;
        
        // 回報每層深度的進度
        self.postMessage({ type: 'progress', depth: currentDepth, maxDepth: targetDepth });
    }
    
    self.postMessage({ type: 'done', bestMove: bestGlobalMove, maxEval: maxGlobalEval });
};
</script>

<!-- 主程式 -->
<script>
eval(document.getElementById('hexCoreLogic').textContent);

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const statusDiv = document.getElementById('status');
const coreInfoDiv = document.getElementById('coreInfo');
const undoBtn = document.getElementById('undoBtn');
const progressContainer = document.getElementById('progressContainer');
const progressBar = document.getElementById('progressBar');
const depthInput = document.getElementById('depthInput');

const HEX_RADIUS = 22;
const HEX_WIDTH = Math.sqrt(3) * HEX_RADIUS;
const HEX_HEIGHT = 2 * HEX_RADIUS;
const TOTAL_WIDTH = HEX_WIDTH + (SIZE - 1) * HEX_WIDTH * 1.5;
const TOTAL_HEIGHT = HEX_HEIGHT + (SIZE - 1) * HEX_HEIGHT * 0.75;
const X_OFFSET = canvas.width / 2 - TOTAL_WIDTH / 2 + HEX_WIDTH / 2;
const Y_OFFSET = canvas.height / 2 - TOTAL_HEIGHT / 2 + HEX_HEIGHT / 2;

let board = new Uint8Array(SIZE * SIZE);
let history = []; 
let currentPlayer = 1; 
let piecesPlacedThisTurn = 0;
let piecesAllowedThisTurn = 1; 
let gameOver = false;
let gameMode = 'pve';
let isAIThinking = false;
let aiSearchDepth = 8;
let aiDelayTimeout = null;

let hasSharedMemory = typeof SharedArrayBuffer !== 'undefined';
const maxCores = navigator.hardwareConcurrency || 4;
let activeWorkers = [];

if (hasSharedMemory) {
    coreInfoDiv.textContent = `⚡ ID迭代加深 + 殺手啟發 + ${maxCores} 核平行同步`;
} else {
    coreInfoDiv.style.color = "#d93025";
    coreInfoDiv.innerHTML = `⚠️ 無 COOP/COEP 標頭，退回單核模式。`;
}

function getPiecesMask(player) {
    let m = 0n;
    for (let i = 0; i < 121; i++) if (board[i] === player) m |= (1n << BigInt(i));
    return m;
}

function getHexCenter(r, c) {
    const x = X_OFFSET + c * HEX_WIDTH + r * (HEX_WIDTH / 2);
    const y = Y_OFFSET + r * (HEX_HEIGHT * 0.75);
    return { x, y };
}

function getHexVertices(cx, cy, radius) {
    const vertices = [];
    for (let i = 0; i < 6; i++) {
        const angle_rad = Math.PI / 180 * (60 * i - 30);
        vertices.push({ x: cx + radius * Math.cos(angle_rad), y: cy + radius * Math.sin(angle_rad) });
    }
    return vertices;
}

function drawHexagon(r, c, fillStyle, hasShadow = false) {
    const { x, y } = getHexCenter(r, c);
    const vertices = getHexVertices(x, y, HEX_RADIUS);
    ctx.beginPath();
    ctx.moveTo(vertices[0].x, vertices[0].y);
    for (let i = 1; i < 6; i++) ctx.lineTo(vertices[i].x, vertices[i].y);
    ctx.closePath();

    if (hasShadow) {
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 4;
    } else { ctx.shadowColor = 'transparent'; }

    ctx.fillStyle = fillStyle;
    ctx.fill();
    ctx.shadowColor = 'transparent'; 
    ctx.strokeStyle = '#a67c52';
    ctx.lineWidth = 1;
    ctx.stroke();
}

function drawPieces() {
    for (let i = 0; i < SIZE * SIZE; i++) {
        if (board[i] !== 0) {
            let r = Math.floor(i / SIZE), c = i % SIZE;
            const { x, y } = getHexCenter(r, c);
            const vertices = getHexVertices(x, y, HEX_RADIUS);
            ctx.beginPath();
            ctx.moveTo(vertices[0].x, vertices[0].y);
            for (let v = 1; v < 6; v++) ctx.lineTo(vertices[v].x, vertices[v].y);
            ctx.closePath();
            const gradient = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, HEX_RADIUS);
            if (board[i] === 1) {
                gradient.addColorStop(0, '#ff6b6b'); gradient.addColorStop(1, '#c92a2a');
            } else {
                gradient.addColorStop(0, '#4dabf7'); gradient.addColorStop(1, '#1864ab');
            }
            ctx.fillStyle = gradient; ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1; ctx.stroke();
        }
    }
}

// 已驗證的精準邊界連線邏輯
function drawBoundaries() {
    ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    
    // 紅色 (上)
    ctx.strokeStyle = '#c92a2a'; ctx.beginPath();
    for (let c = 0; c < SIZE; c++) {
        let v = getHexVertices(getHexCenter(0, c).x, getHexCenter(0, c).y, HEX_RADIUS);
        if (c === 0) ctx.moveTo(v[4].x, v[4].y);
        ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[0].x, v[0].y);
    }
    ctx.stroke();
    // 紅色 (下)
    ctx.beginPath();
    for (let c = 0; c < SIZE; c++) {
        let v = getHexVertices(getHexCenter(SIZE - 1, c).x, getHexCenter(SIZE - 1, c).y, HEX_RADIUS);
        if (c === 0) ctx.moveTo(v[3].x, v[3].y);
        ctx.lineTo(v[2].x, v[2].y); ctx.lineTo(v[1].x, v[1].y);
    }
    ctx.stroke();

    // 藍色 (左)
    ctx.strokeStyle = '#1864ab'; ctx.beginPath();
    for (let r = 0; r < SIZE; r++) {
        let v = getHexVertices(getHexCenter(r, 0).x, getHexCenter(r, 0).y, HEX_RADIUS);
        if (r === 0) ctx.moveTo(v[4].x, v[4].y);
        ctx.lineTo(v[3].x, v[3].y);
        if (r !== SIZE - 1) ctx.lineTo(v[2].x, v[2].y);
    }
    ctx.stroke();
    // 藍色 (右)
    ctx.beginPath();
    for (let r = 0; r < SIZE; r++) {
        let v = getHexVertices(getHexCenter(r, SIZE - 1).x, getHexCenter(r, SIZE - 1).y, HEX_RADIUS);
        if (r === 0) {
            ctx.moveTo(v[0].x, v[0].y);
        } else {
            ctx.lineTo(v[5].x, v[5].y);
            ctx.lineTo(v[0].x, v[0].y);
        }
        ctx.lineTo(v[1].x, v[1].y);
    }
    ctx.stroke();
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) drawHexagon(r, c, '#f9d18c', true);
    }
    drawPieces(); drawBoundaries();
}

function updateStatus() {
    if (gameOver) return;
    statusDiv.textContent = `輪到 ${currentPlayer === 1 ? '🔴 紅棋' : '🔵 藍棋'} (${piecesPlacedThisTurn + 1}/${piecesAllowedThisTurn} 子)`;
}

function updateDepth() {
    let val = parseInt(depthInput.value);
    if (isNaN(val) || val < 2) val = 2; if (val > 16) val = 16;
    depthInput.value = val; aiSearchDepth = val;
}

function processMove(index) {
    if (board[index] !== 0 || gameOver || isAIThinking) return;

    board[index] = currentPlayer;
    piecesPlacedThisTurn++;
    history.push({ index, player: currentPlayer, placed: piecesPlacedThisTurn, allowed: piecesAllowedThisTurn });

    if (checkWinBB(getPiecesMask(currentPlayer), currentPlayer)) {
        render();
        statusDiv.textContent = `🎉 ${(currentPlayer === 1 ? '🔴 紅棋' : '🔵 藍棋')} 獲勝！`;
        gameOver = true; return;
    }

    if (piecesPlacedThisTurn >= piecesAllowedThisTurn) {
        currentPlayer = 3 - currentPlayer;
        piecesPlacedThisTurn = 0; piecesAllowedThisTurn = 2; 
    }

    render(); updateStatus(); checkAITurn();
}

function undoMove() {
    if (history.length === 0 || isAIThinking) return;
    if (aiDelayTimeout) { clearTimeout(aiDelayTimeout); aiDelayTimeout = null; }

    gameOver = false;
    const lastMove = history.pop();
    board[lastMove.index] = 0;
    
    currentPlayer = lastMove.player;
    piecesPlacedThisTurn = lastMove.placed - 1;
    piecesAllowedThisTurn = lastMove.allowed;

    render(); updateStatus();

    let isAITurn = (gameMode === 'pve' && currentPlayer === 2) || (gameMode === 'evp' && currentPlayer === 1);
    if (isAITurn) {
        statusDiv.textContent = "AI 等待中 (1.5秒內可繼續悔棋)...";
        aiDelayTimeout = setTimeout(() => checkAITurn(), 1500);
    }
}

function checkAITurn() {
    if (gameOver || history.length === 0 && gameMode === 'pvp') return;
    let isAITurn = (gameMode === 'pve' && currentPlayer === 2) || (gameMode === 'evp' && currentPlayer === 1);
    if (isAITurn && !isAIThinking) triggerAIWorker();
}

function triggerAIWorker() {
    isAIThinking = true; undoBtn.disabled = true; document.getElementById('modeSelect').disabled = true;
    updateDepth();

    statusDiv.style.color = "#1e8e3e";
    statusDiv.textContent = `🤖 AI 啟發式迭代推演中 (深度 ${aiSearchDepth})...`;
    
    let redPieces = getPiecesMask(1);
    let bluePieces = getPiecesMask(2);
    let emptySpaces = BOARD_MASK & ~(redPieces | bluePieces);
    
    let candidates = [];
    for (let i = 0n; i < 121n; i++) {
        if (emptySpaces & (1n << i)) {
            let idx = Number(i);
            let nr = currentPlayer === 1 ? (redPieces | (1n<<i)) : redPieces;
            let nb = currentPlayer === 2 ? (bluePieces | (1n<<i)) : bluePieces;
            candidates.push({ move: idx, score: evalBB(nr, nb, currentPlayer) });
        }
    }
    // 根節點利用基本距離評估，後續深入則交給歷史啟發
    candidates.sort((a,b) => b.score - a.score);
    let topCandidates = candidates.slice(0, 16).map(c => c.move); // 保留更多根節點供 ID 排序

    if (topCandidates.length === 0) {
        isAIThinking = false; gameOver = true;
        statusDiv.textContent = "🏳️ AI 無路可走！"; return;
    }

    progressContainer.style.display = 'block'; progressBar.style.width = '0%';

    let baseHash = ZOBRIST_TURN[(currentPlayer - 1) * 3 + piecesPlacedThisTurn];
    for (let i = 0n; i < 121n; i++) {
        if (redPieces & (1n << i)) baseHash ^= ZOBRIST_PIECES[Number(i)]; 
        if (bluePieces & (1n << i)) baseHash ^= ZOBRIST_PIECES[121 + Number(i)]; 
    }

    const fullWorkerCode = document.getElementById('hexCoreLogic').textContent + "\n" + document.getElementById('aiWorkerCode').textContent;
    const workerBlob = new Blob([fullWorkerCode], { type: "text/javascript" });
    const workerUrl = URL.createObjectURL(workerBlob);

    let sharedBuffer = null;
    let effectiveCores = 1;
    if (hasSharedMemory) {
        sharedBuffer = new SharedArrayBuffer(4);
        new Int32Array(sharedBuffer)[0] = -100000000;
        effectiveCores = maxCores;
    }

    const chunks = Array.from({length: effectiveCores}, () => []);
    topCandidates.forEach((move, index) => chunks[index % effectiveCores].push(move));

    let bestGlobalMove = null, maxGlobalEval = -Infinity, completedWorkers = 0, actualWorkersUsed = 0;
    activeWorkers = [];

    // ID 疊加式進度條追蹤
    let combinedProgress = new Array(effectiveCores).fill(0);

    chunks.forEach((chunk, workerIdx) => {
        if (chunk.length === 0) return;
        actualWorkersUsed++;
        
        const worker = new Worker(workerUrl);
        activeWorkers.push(worker);
        
        worker.onmessage = function(e) {
            if (e.data.type === 'progress') {
                combinedProgress[workerIdx] = e.data.depth / e.data.maxDepth;
                let total = combinedProgress.reduce((a,b) => a+b, 0) / actualWorkersUsed;
                progressBar.style.width = `${total * 100}%`;
            } else if (e.data.type === 'done') {
                completedWorkers++;
                if (e.data.bestMove !== null && e.data.maxEval > maxGlobalEval) {
                    maxGlobalEval = e.data.maxEval; bestGlobalMove = e.data.bestMove;
                }
                if (completedWorkers === actualWorkersUsed) {
                    activeWorkers.forEach(w => w.terminate());
                    URL.revokeObjectURL(workerUrl);
                    
                    progressContainer.style.display = 'none';
                    isAIThinking = false; undoBtn.disabled = false; document.getElementById('modeSelect').disabled = false;
                    
                    statusDiv.style.color = "#d93025";
                    processMove(bestGlobalMove !== null ? bestGlobalMove : topCandidates[0]);
                }
            }
        };

        worker.postMessage({
            redPieces, bluePieces, baseHash,
            moves: chunk, targetDepth: aiSearchDepth,
            aiPlayerId: currentPlayer, piecesPlaced: piecesPlacedThisTurn, piecesAllowed: piecesAllowedThisTurn,
            sharedBuffer
        });
    });
}

canvas.addEventListener('click', (e) => {
    if (gameOver || isAIThinking) return;
    let isPlayerTurn = (gameMode === 'pve' && currentPlayer === 1) || (gameMode === 'evp' && currentPlayer === 2) || gameMode === 'pvp';
    if (!isPlayerTurn) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const { x, y } = getHexCenter(r, c);
            if (Math.hypot(mx - x, my - y) < HEX_RADIUS * 0.9) {
                processMove(r * SIZE + c); return;
            }
        }
    }
});

function init() {
    board.fill(0); history = [];
    currentPlayer = 1; piecesPlacedThisTurn = 0; piecesAllowedThisTurn = 1;
    gameOver = false; isAIThinking = false;
    if (aiDelayTimeout) clearTimeout(aiDelayTimeout);
    
    updateDepth(); gameMode = document.getElementById('modeSelect').value;
    undoBtn.disabled = false; progressContainer.style.display = 'none';

    render(); updateStatus();
    if (gameMode === 'evp') setTimeout(triggerAIWorker, 100);
}

function restartGame() {
    if (isAIThinking) { activeWorkers.forEach(w => w.terminate()); activeWorkers = []; isAIThinking = false; }
    init();
}
function changeMode() { if (!isAIThinking) init(); }
init();
</script>
