<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>網頁原始碼檢視器 (手機版)</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />

    <style>
        /* 全域設定 */
        * {
            box-sizing: border-box; /* 確保寬度計算包含邊框 */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212; /* 深色模式背景 */
            margin: 0;
            padding: 0;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 主容器 */
        .container {
            width: 100%;
            max-width: 900px;
            background: #1e1e1e;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            height: 100vh; /* 手機版佔滿全螢幕 */
        }

        /* 標題 */
        h2 {
            text-align: center;
            font-size: 1.2rem;
            margin: 10px 0 15px 0;
            color: #fff;
        }

        /* 輸入區塊 (Flexbox) */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap; /* 允許換行 */
        }
        
        input[type="text"] {
            flex: 1; /* 佔滿剩餘空間 */
            min-width: 200px; /* 最小寬度 */
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 16px; /* 防止 iOS 自動縮放輸入框 */
            outline: none;
            -webkit-appearance: none; /* 移除 iOS 預設陰影 */
        }
        
        input[type="text"]:focus {
            border-color: #4caf50;
        }

        button {
            padding: 12px 20px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            /* 手機優化：按鈕稍微大一點 */
            touch-action: manipulation; 
        }
        
        button:active {
            background-color: #1b5e20;
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #555;
            color: #888;
        }

        /* 進度條 */
        .progress-container {
            width: 100%;
            background-color: #333;
            border-radius: 4px;
            height: 4px;
            margin-bottom: 10px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #4caf50;
            transition: width 0.2s;
        }

        /* 狀態列 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
            padding: 0 5px;
        }

        /* 程式碼視窗 */
        .code-window {
            flex: 1; /* 自動填滿剩下的垂直空間 */
            position: relative;
            overflow: auto; /* 允許捲動 */
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #272822; /* Okaidia 背景色 */
            -webkit-overflow-scrolling: touch; /* 讓 iOS 捲動更滑順 */
        }

        /* 針對手機的小螢幕優化 (RWD) */
        @media (max-width: 600px) {
            .container {
                height: 100vh; /* 確保佔滿視窗 */
                padding: 10px;
            }
            .input-group {
                flex-direction: column; /* 上下排列 */
                gap: 8px;
            }
            button {
                width: 100%; /* 按鈕變全寬，方便手指點擊 */
                padding: 14px;
            }
            input[type="text"] {
                padding: 14px;
            }
            h2 {
                font-size: 1.1rem;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📱 原始碼檢視器 <span style="font-size:0.7em; color:#4caf50">Mobile</span></h2>
    
    <div class="input-group">
        <input type="text" id="urlInput" placeholder="輸入網址 (例如 google.com)" inputmode="url">
        <button id="fetchBtn" onclick="startFetch()">取得原始碼</button>
    </div>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status-bar">
        <span id="statusMsg">等待輸入...</span>
        <span id="percentText"></span>
    </div>

    <div class="code-window">
        <pre class="line-numbers"><code id="codeOutput" class="language-html">
</code></pre>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>

<script>
    // 監聽 Enter 鍵
    document.getElementById('urlInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') startFetch();
    });

    let progressInterval = null;

    async function startFetch() {
        const urlInput = document.getElementById('urlInput');
        const codeBlock = document.getElementById('codeOutput');
        const btn = document.getElementById('fetchBtn');
        const status = document.getElementById('statusMsg');
        const pContainer = document.getElementById('progressContainer');
        const pBar = document.getElementById('progressBar');
        const pText = document.getElementById('percentText');
        
        let targetUrl = urlInput.value.trim();

        // 收起手機鍵盤 (UX 優化)
        urlInput.blur();

        if (!targetUrl) {
            status.textContent = "❌ 請輸入網址";
            status.style.color = "#ff6b6b";
            return;
        }
        if (!/^https?:\/\//i.test(targetUrl)) {
            targetUrl = 'https://' + targetUrl;
            urlInput.value = targetUrl;
        }

        // 初始化
        btn.disabled = true;
        btn.textContent = "讀取中...";
        codeBlock.textContent = "正在連線...";
        status.textContent = "正在下載...";
        status.style.color = "#a5d6ff";
        
        pContainer.style.display = "block";
        pBar.style.width = "5%";
        pText.textContent = "5%";
        
        // 模擬進度條
        let currentProgress = 5;
        clearInterval(progressInterval);
        progressInterval = setInterval(() => {
            if (currentProgress < 90) {
                // 隨機增加進度，讓感覺更自然
                currentProgress += Math.random() * 8;
                if(currentProgress > 90) currentProgress = 90;
                pBar.style.width = currentProgress + "%";
                pText.textContent = Math.round(currentProgress) + "%";
            }
        }, 150);

        try {
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
            // 設定 timeout 防止手機網路太慢卡死
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000); // 15秒超時

            const response = await fetch(proxyUrl, { signal: controller.signal });
            clearTimeout(timeoutId);
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const text = await response.text();

            // 完成
            clearInterval(progressInterval);
            pBar.style.width = "100%";
            pText.textContent = "100%";
            status.textContent = "✅ 處理語法高亮中...";
            
            // 寫入並渲染
            codeBlock.textContent = text;
            Prism.highlightElement(codeBlock);

            status.textContent = `✅ 成功 (共 ${text.length} 字元)`;
            status.style.color = "#4caf50";
            
            // 手機版提示滑動
            if(window.innerWidth < 600) {
                 status.textContent += " (可左右滑動查看)";
            }

        } catch (error) {
            clearInterval(progressInterval);
            pBar.style.backgroundColor = "#ff6b6b";
            let errorMsg = error.message;
            if (error.name === 'AbortError') errorMsg = "連線逾時，請檢查網路";
            
            status.textContent = `❌ ${errorMsg}`;
            status.style.color = "#ff6b6b";
            codeBlock.textContent = "讀取失敗。\n\n常見原因：\n1. 網址輸入錯誤\n2. 該網站封鎖代理訪問 (如 FB/Google)\n3. 手機網路不穩";
        } finally {
            btn.disabled = false;
            btn.textContent = "取得原始碼";
            setTimeout(() => {
                pContainer.style.display = "none";
                pText.textContent = "";
                // 重置進度條顏色
                pBar.style.backgroundColor = "#4caf50"; 
            }, 3000);
        }
    }
</script>

</body>
</html>
